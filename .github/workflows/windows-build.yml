name: Windows Build

on:
  push:
    branches:
      - main
      - feature/npm-windows-migration
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm install

      - name: Typecheck
        shell: pwsh
        run: npm run typecheck

      - name: Build CINTEXA frontend
        shell: pwsh
        run: npm run build:app

      - name: Build API
        shell: pwsh
        run: npm run build --workspace=@workspace/api-server
