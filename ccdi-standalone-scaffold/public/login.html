<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — CINTEXA CCDI</title>
<link rel="stylesheet" href="assets/css/main.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .auth-card { width: 420px; max-width: 100%; }
  .auth-brand { display:flex; align-items:center; gap:12px; justify-content:center; margin-bottom: 28px; }
  .auth-brand .brand-mark { width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--accent-cyan),var(--accent-cyan-dim));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:#04141a;font-size:17px; }
  .auth-brand strong { font-family:var(--font-display); font-size:19px; display:block; }
  .auth-brand span { font-size:11px; color:var(--text-tertiary); letter-spacing:0.08em; text-transform:uppercase; }
  .tab-row { display:flex; gap:4px; background:var(--bg-base); border-radius:var(--radius-sm); padding:4px; margin-bottom:20px; }
  .tab-btn { flex:1; padding:8px; text-align:center; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--text-tertiary); }
  .tab-btn.active { background:var(--bg-panel-raised); color:var(--text-primary); }
  .err-msg { font-size:12px; color:var(--sev-critical); min-height:16px; margin-top:4px; }
  .form-pane { display:none; }
  .form-pane.active { display:flex; flex-direction:column; gap:14px; }
</style>
</head>
<body>
  <div class="auth-card card card-pad">
    <div class="auth-brand">
      <div class="brand-mark">CX</div>
      <div><strong>CINTEXA</strong><span>Cyber Defense &amp; Security Intelligence</span></div>
    </div>

    <div class="tab-row">
      <button class="tab-btn active" data-tab="signin">Sign in</button>
      <button class="tab-btn" data-tab="signup">Create tenant</button>
    </div>

    <form id="signin-form" class="form-pane active">
      <div class="field">
        <label>Email</label>
        <input class="input" type="email" id="si-email" required autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input class="input" type="password" id="si-password" required autocomplete="current-password" />
      </div>
      <div class="err-msg" id="si-error"></div>
      <button class="btn btn-primary" type="submit" id="si-submit">Sign in</button>
      <a href="#" id="forgot-link" style="font-size:12px;text-align:center;color:var(--text-tertiary)">Forgot password?</a>
    </form>

    <form id="signup-form" class="form-pane">
      <div class="field">
        <label>Organization name</label>
        <input class="input" type="text" id="su-org" required placeholder="Acme Corp" />
      </div>
      <div class="field">
        <label>Your full name</label>
        <input class="input" type="text" id="su-name" required />
      </div>
      <div class="field">
        <label>Email</label>
        <input class="input" type="email" id="su-email" required autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input class="input" type="password" id="su-password" required minlength="8" autocomplete="new-password" />
        <span class="hint">Minimum 8 characters. You'll be the Owner of this tenant.</span>
      </div>
      <div class="err-msg" id="su-error"></div>
      <button class="btn btn-primary" type="submit" id="su-submit">Create tenant &amp; sign in</button>
    </form>

    <p style="font-size:11px;color:var(--text-tertiary);text-align:center;margin-top:18px">
      By continuing you agree this platform is used only against assets you own or are explicitly authorized to assess.
    </p>
  </div>

  <script type="module">
    import { login, registerOwner } from './assets/js/core/auth.js';
    import { api } from './assets/js/core/api.js';

    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        document.querySelectorAll('.form-pane').forEach((p) => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`${btn.dataset.tab}-form`).classList.add('active');
      });
    });

    document.getElementById('signin-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('si-error');
      const btn = document.getElementById('si-submit');
      errEl.textContent = '';
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        await login(document.getElementById('si-email').value.trim(), document.getElementById('si-password').value);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errEl.textContent = friendlyAuthError(err);
      } finally {
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    });

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('su-error');
      const btn = document.getElementById('su-submit');
      errEl.textContent = '';
      btn.disabled = true; btn.textContent = 'Creating…';
      try {
        const user = await registerOwner(
          document.getElementById('su-email').value.trim(),
          document.getElementById('su-password').value,
          document.getElementById('su-name').value.trim(),
        );
        await api.bootstrapTenant({
          orgName: document.getElementById('su-org').value.trim(),
          ownerUid: user.uid,
          ownerEmail: user.email,
          ownerDisplayName: document.getElementById('su-name').value.trim(),
        });
        window.location.href = 'dashboard.html';
      } catch (err) {
        errEl.textContent = friendlyAuthError(err);
      } finally {
        btn.disabled = false; btn.textContent = 'Create tenant & sign in';
      }
    });

    document.getElementById('forgot-link').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('si-email').value.trim();
      if (!email) { document.getElementById('si-error').textContent = 'Enter your email above first.'; return; }
      const { resetPassword } = await import('./assets/js/core/auth.js');
      try {
        await resetPassword(email);
        document.getElementById('si-error').style.color = 'var(--status-ok)';
        document.getElementById('si-error').textContent = 'Password reset email sent.';
      } catch (err) {
        document.getElementById('si-error').textContent = friendlyAuthError(err);
      }
    });

    function friendlyAuthError(err) {
      const code = err.code || '';
      const map = {
        'auth/invalid-credential': 'Incorrect email or password.',
        'auth/wrong-password': 'Incorrect email or password.',
        'auth/user-not-found': 'No account found with that email.',
        'auth/email-already-in-use': 'An account with that email already exists.',
        'auth/weak-password': 'Password is too weak — use at least 8 characters.',
        'auth/invalid-email': 'Enter a valid email address.',
        'auth/too-many-requests': 'Too many attempts. Try again later.',
      };
      return map[code] || err.message || 'Something went wrong. Please try again.';
    }
  </script>
</body>
</html>
